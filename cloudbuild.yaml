
steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/github.com/saravanakumarmj/qr-scanner-web:$COMMIT_SHA'
      - '.'

  # 2. Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/github.com/saravanakumarmj/qr-scanner-web:$COMMIT_SHA'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'qr-scanner-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/github.com/saravanakumarmj/qr-scanner-web:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--quiet'

images:
  - 'gcr.io/$PROJECT_ID/github.com/saravanakumarmj/qr-scanner-web:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
